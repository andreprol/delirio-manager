run:
  timeout: 3m

linters:
  enable:
    - errcheck      # Verifica erros de retorno ignorados
    - gosimple      # Simplificações idiomáticas
    - govet         # Análise estática padrão (go vet)
    - ineffassign   # Atribuições sem efeito
    - staticcheck   # Conjunto amplo de análises estáticas
    - unused        # Identificadores não usados
    - cyclop        # Complexidade ciclomática — máx 10 por função (Cap. 5 Eng.Soft.Moderna)

linters-settings:
  errcheck:
    check-type-assertions: false  # type assertions sem ok são comuns em Go idiomático
  cyclop:
    # Meta Cap.5 Eng.Soft.Moderna atingida em 14/07/2026.
    # Refactors: executeCommand(50→2), sendHeartbeat(16→7), readTemperatures(21→4),
    # collectMetrics(15→6), listNFCeMonths(13→4), main(12→3),
    # checkAndUpdate(11→7), installVeeam(11→7), readStatus(11→5), downloadAndExtractLHM(11→6).
    max-complexity: 10
    skip-tests: true    # testes podem ter branches sem ser smells

issues:
  # Permite comentar no mesmo arquivo que o erro foi detectado
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck  # Testes frequentemente ignoram erros intencionalmente
