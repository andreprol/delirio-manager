name: CI — Dashboard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Vitest (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
