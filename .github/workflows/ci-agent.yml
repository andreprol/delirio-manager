name: CI — Agent (Go)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: go test (Windows / Go 1.22)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Run tests
        run: go test ./... -v -count=1 -timeout 120s
