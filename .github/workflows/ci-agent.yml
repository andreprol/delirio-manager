name: CI — Agent (Go)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: go test (Windows / Go 1.22)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: agent

      - name: Run tests with coverage
        run: go test ./... -v -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold (≥16% — elevar gradualmente)
        shell: pwsh
        run: |
          $output = go tool cover -func=coverage.out
          $totalLine = $output | Select-String "total:"
          if (-not $totalLine) { Write-Error "No coverage data"; exit 1 }
          $pct = [double]($totalLine.Line -replace '.*\s+([\d.]+)%\s*$', '$1')
          Write-Host "Coverage: $pct%"
          # Threshold atual: 16% (baseline 14/07/2026). Elevar +5% a cada sprint conforme testes forem adicionados. Meta: 70%.
          if ($pct -lt 16) { Write-Error "Coverage $pct% below 16% threshold — tests were removed or dead code added."; exit 1 }
