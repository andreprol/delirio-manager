name: CI — Agent (Go)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: go test (Windows / Go 1.22)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: agent

      - name: Run tests + coverage threshold (≥16% — elevar gradualmente)
        shell: pwsh
        working-directory: agent
        run: |
          $output = go test ./... -v -count=1 -timeout 120s -cover 2>&1
          $output | Write-Host
          # Threshold atual: 16% (baseline 14/07/2026). Elevar +5% a cada sprint. Meta: 70%.
          $totalLine = ($output | Select-String 'coverage: [\d.]+% of statements') | Select-Object -Last 1
          if (-not $totalLine) { Write-Error "No coverage data found in test output"; exit 1 }
          $pct = [double]($totalLine.Line -replace '.*coverage: ([\d.]+)%.*', '$1')
          Write-Host "Coverage: $pct%"
          if ($pct -lt 16) { Write-Error "Coverage $pct% below 16% threshold — tests were removed or dead code added."; exit 1 }
          exit $LASTEXITCODE
